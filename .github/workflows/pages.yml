name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 設定 GitHub Pages 自動部署所需的最小權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時只有一個 Pages 部署在進行，若短時間連續觸發則自動取消排隊中的舊部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Portfolio & Execution Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & generate fresh execution results
        run: |
          uv sync
          uv run lunch --budget 150 --taste 辣 --diet 不吃牛 --people 2 --mock

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
