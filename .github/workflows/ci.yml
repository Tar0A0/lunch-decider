name: CI (Ruff & Pytest & CLI Verification)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Ruff, Pytest & Mock CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Pytest Unit Tests
        run: uv run pytest -v

      - name: Verify CLI Execution (--mock mode)
        run: uv run lunch --budget 150 --taste 辣 --diet 不吃牛 --people 2 --mock
